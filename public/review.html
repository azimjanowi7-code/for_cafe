<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive review</title><style>body{margin:0;background:#e7dfd8;font:14px system-ui;color:#1f1a17}header{padding:16px;display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:1;background:white}a{color:#7c4a2d;padding:8px}main{padding:16px}section{margin:24px 0}h2{font-size:18px}iframe{display:block;border:0;background:white;transform-origin:top left;box-shadow:0 4px 12px #1f1a171a}.frame{position:relative}pre{white-space:pre-wrap;background:white;padding:16px;line-height:1.6}</style><header><strong>Responsive review</strong><nav id="widths"></nav><nav id="screens"></nav></header><main><pre id="audit" role="status">Loading layout checks…</pre><div id="frames"></div></main><script>
const params=new URLSearchParams(location.search);if(params.get('focus')==='1'){document.querySelector('header').style.display='none';document.querySelector('#audit').style.display='none'}const frameHeight=Number(params.get('height'))>=480?Number(params.get('height')):1200;const widths=[360,390,768,1024,1440],pages=['cook','waiter','waiter?tab=menu','waiter?tab=stats','admin','admin?panel=menu','admin?panel=staff','admin?panel=tables','admin?panel=settings','qr','login','login?step=credentials','gallery','guide'];
const page=pages.includes(params.get('page'))?params.get('page'):'cook';
for(const width of widths){const a=document.createElement('a');a.href='?'+new URLSearchParams({width,page});a.textContent=width+' px';document.querySelector('#widths').append(a)}
for(const screen of pages){const a=document.createElement('a');a.href='?'+new URLSearchParams({page:screen});a.textContent=screen;document.querySelector('#screens').append(a)}
const selected=Number(params.get('width')),sizes=widths.includes(selected)?[selected]:widths;const reports={};
function measure(frame,width,screen){const doc=frame.contentDocument;if(!doc.querySelector('.app')){setTimeout(()=>measure(frame,width,screen),200);return}const offenders=[];for(const el of doc.querySelectorAll('body *')){if(!el.getClientRects().length||el.closest('.category-chips')||['SCRIPT','STYLE','INPUT','TEXTAREA','SVG','PATH'].includes(el.tagName))continue;const rect=el.getBoundingClientRect(),style=frame.contentWindow.getComputedStyle(el);if(style.visibility==='hidden'||style.display==='none'||el.classList.contains('sr-only'))continue;if(rect.left<-.5||rect.right>width+.5)offenders.push(el.tagName+'.'+el.className+' x='+Math.round(rect.x)+' width='+Math.round(rect.width));if(el.clientWidth>0&&el.scrollWidth>el.clientWidth+2&&['auto','scroll'].includes(style.overflowX)&&!el.classList.contains('category-chips'))offenders.push('horizontal scroller: '+el.className)}const columns=selector=>frame.contentWindow.getComputedStyle(doc.querySelector(selector)).gridTemplateColumns.split(' ').length;
if(screen==='cook'&&columns('.ticket-grid')!==(width<768?1:width<1280?2:width<1440?3:4))offenders.push('incorrect cook column count');
if(screen==='qr'&&columns('.qr-dishes')!==(width<640?1:2))offenders.push('incorrect QR column count');
if(screen.startsWith('waiter')&&!screen.includes('stats')&&width>=768){const left=doc.querySelector('.waiter-tables-pane').getBoundingClientRect(),right=doc.querySelector('.waiter-order-pane').getBoundingClientRect();if(!left.width||!right.width||left.right>right.left)offenders.push('waiter split overlaps or is hidden')}
if(screen.startsWith('admin')){const sidebar=frame.contentWindow.getComputedStyle(doc.querySelector('.admin-sidebar')).display;if((width<1024&&sidebar!=='none')||(width>=1024&&sidebar==='none'))offenders.push('incorrect admin sidebar breakpoint')}
const bar=doc.querySelector('.order-send-bar'),nav=doc.querySelector('.bottom-nav');if(bar?.getClientRects().length&&nav?.getClientRects().length&&bar.getBoundingClientRect().bottom>nav.getBoundingClientRect().top+1)offenders.push('send bar overlaps bottom navigation');
reports[screen+' @ '+width]={documentWidth:doc.documentElement.scrollWidth,viewport:width,offenders:[...new Set(offenders)].slice(0,16)};const failures=Object.entries(reports).filter(([key,r])=>r.offenders.length||r.documentWidth>r.viewport);document.querySelector('#audit').textContent=page+' · completed '+Object.keys(reports).length+'/'+sizes.length+' · failures '+failures.length+'\n'+failures.map(([key,r])=>key+': '+JSON.stringify(r)).join('\n')+'\n'+[page].map(screen=>screen+': '+Object.keys(reports).filter(key=>key.startsWith(screen+' @ ')).length+'/'+sizes.length).join('\n')}
for(const screen of [page])for(const width of sizes){const section=document.createElement('section'),title=document.createElement('h2'),wrap=document.createElement('div'),frame=document.createElement('iframe');title.textContent=width+' px · '+screen;frame.title=title.textContent;if(params.get('interactive')!=='1')frame.setAttribute('aria-hidden','true');frame.style.width=width+'px';frame.style.height=frameHeight+'px';const scale=Math.min(1,(innerWidth-32)/width);if(scale<1)frame.style.transform='scale('+scale+')';wrap.style.height=(frameHeight*scale)+'px';wrap.className='frame';frame.src='/'+screen;frame.addEventListener('load',()=>setTimeout(()=>measure(frame,width,screen),600));wrap.append(frame);section.append(title,wrap);document.querySelector('#frames').append(section)}
</script></html>
