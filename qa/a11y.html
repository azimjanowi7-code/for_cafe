<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Accessibility audit</title><style>body{font:16px system-ui;margin:16px}pre{white-space:pre-wrap}iframe{width:100%;height:700px;border:1px solid #777}a{display:inline-block;margin:8px;padding:8px}</style></head><body><h1>Accessibility audit</h1><nav><a href="?page=qr">QR</a><a href="?page=cook">Cook dark</a><a href="?page=cook&theme=light">Cook light</a><a href="?page=login">Login</a></nav><pre id="result" role="status">Loading…</pre><iframe title="Audited application"></iframe><script>
const params=new URLSearchParams(location.search),page=['qr','cook','login','waiter','admin'].includes(params.get('page'))?params.get('page'):'qr';const frame=document.querySelector('iframe');frame.style.width=(params.get('width')||'390')+'px';frame.src='/'+page+(params.get('theme')==='light'?'?theme=light':'');
frame.addEventListener('load',async()=>{try{while(!frame.contentDocument.querySelector('.app'))await new Promise(r=>setTimeout(r,100));await frame.contentDocument.fonts.ready;const script=frame.contentDocument.createElement('script');script.src='/node_modules/axe-core/axe.min.js';script.onload=async()=>{try{const result=await frame.contentWindow.axe.run(frame.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','best-practice']}});const summary={page,theme:params.get('theme')||'dark',axe:result.testEngine.version,passes:result.passes.length,violations:result.violations.map(v=>({id:v.id,impact:v.impact,help:v.help,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:result.incomplete.map(v=>({id:v.id,nodes:v.nodes.length}))};window.auditResult=result;document.querySelector('#result').textContent=JSON.stringify(summary,null,2)}catch(error){document.querySelector('#result').textContent=String(error)}};script.onerror=()=>document.querySelector('#result').textContent='axe script failed';frame.contentDocument.head.append(script)}catch(error){document.querySelector('#result').textContent=String(error)}});
</script></body></html>
